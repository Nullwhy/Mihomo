# Mihomo 裸核最小配置
# 作者：Nullwhy
# 更新时间: 26-08-15 00:00

# [端口设置]
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7894

# [通用设置]
external-controller: 0.0.0.0:9090
external-ui: ui
geodata-loader: standard
unified-delay: true
allow-lan: true
ipv6: false
mode: rule
log-level: info
tcp-concurrent: true
find-process-mode: strict
global-client-fingerprint: chrome

# [数据库]
geodata-mode: false
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geoip.dat"
  geosite: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/geosite.dat"
  mmdb: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/country.mmdb"
  asn: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/release/GeoLite2-ASN.mmdb"

# [DNS设置]
dns:
  enable: true
  ipv6: false
  prefer-h3: false
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  fake-ip-filter:
    - '*.lan'
    - '+.local'
  fake-ip-range: 198.18.0.1/16

# [TUN设置]
tun:
  enable: true
  stack: mixed
  dns-hijack:
    - any:53
  auto-route: true
  auto-detect-interface: true

# [缓存设置]
profile:
  store-selected: true
  store-fake-ip: true

# [嗅探设置]
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80,8080-8880]
      override-destination: true
    TLS:
      ports: [443,8443]
    QUIC:
      ports: [443,8443]

# [订阅节点]
proxy-providers:
  subscribe:
    type: http
    url: "XXXXXX"  # 订阅链接
    path: ./Server/subscribe.yaml
    interval: 86400
    health-check:
      enable: true
      url: https://cp.cloudflare.com/generate_204
      interval: 1800
      timeout: 5000

# [策略组]
proxy-groups:
  - name: "AllProxy"
    type: select
    icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/China.png
    url: "https://cp.cloudflare.com/generate_204"
    include-all: true
    filter: "^"
    interval: 1800
    lazy: true

  - name: "Global"
    type: select
    icon: https://raw.githubusercontent.com/Centralmatrix3/Matrix-io/master/Gallery/Color/Global.png
    proxies:
      - AllProxy
      - HK
      - TW
      - JP
      - KR
      - SG
      - US
      
  - name: "Final"
    type: select
    icon: https://raw.githubusercontent.com/Orz-3/mini/master/Color/Adblock.png
    proxies:
      - AllProxy
      - Global
      - DIRECT
      - REJECT

  - name: "HK"
    type: url-test
    icon: https://raw.githubusercontent.com/Centralmatrix3/Matrix-io/master/Gallery/Color/HK.png
    url: "https://cp.cloudflare.com/generate_204"
    include-all: true
    filter: "香港|港|🇭🇰|HK|(?i)Hong"
    tolerance: 50
    interval: 1800
    lazy: true

  - name: "TW"
    type: url-test
    icon: https://raw.githubusercontent.com/Centralmatrix3/Matrix-io/master/Gallery/Color/TW.png
    url: "https://cp.cloudflare.com/generate_204"
    include-all: true
    filter: "台湾|台|TW|🇹🇼|(?i)Taiwan"
    tolerance: 50
    interval: 1800
    lazy: true

  - name: "JP"
    type: url-test
    icon: https://raw.githubusercontent.com/Centralmatrix3/Matrix-io/master/Gallery/Color/JP.png
    url: "https://cp.cloudflare.com/generate_204"
    include-all: true
    filter: "日本|日|JP|🇯🇵|(?i)Japan"
    tolerance: 50
    interval: 1800
    lazy: true

  - name: "KR"
    type: url-test
    icon: https://raw.githubusercontent.com/Centralmatrix3/Matrix-io/master/Gallery/Color/KR.png
    url: "https://cp.cloudflare.com/generate_204"
    include-all: true
    filter: "韩国|韩|KR|🇰🇷|(?i)Korea"
    tolerance: 50
    interval: 1800
    lazy: true

  - name: "SG"
    type: url-test
    icon: https://raw.githubusercontent.com/Centralmatrix3/Matrix-io/master/Gallery/Color/SG.png
    url: "https://cp.cloudflare.com/generate_204"
    include-all: true
    filter: "新加坡|狮|SG|🇸🇬|(?i)Singapore"
    tolerance: 50
    interval: 1800
    lazy: true

  - name: "US"
    type: url-test
    icon: https://raw.githubusercontent.com/Centralmatrix3/Matrix-io/master/Gallery/Color/US.png
    url: "https://cp.cloudflare.com/generate_204"
    include-all: true
    filter: "美国|美|US|🇺🇸|(?i)States"
    tolerance: 50
    interval: 1800
    lazy: true

# [本地规则]
rules:
  - RULE-SET,规则修正,DIRECT
  - RULE-SET,广告拦截,REJECT
  - RULE-SET,Global,Global
  - RULE-SET,LAN,DIRECT
  - RULE-SET,GEOIPCN,DIRECT
  - MATCH,Final

# [远程规则]
rule-providers:
  规则修正:
    type: http
    path: ./Ruleset/Unbreak.yaml
    url: https://raw.githubusercontent.com/Centralmatrix3/Matrix-io/master/Clash/Ruleset/Unbreak.yaml
    behavior: classical
    interval: 86400
    format: yaml

  广告拦截:
    type: http
    path: ./Ruleset/Advertising.yaml
    url: https://raw.githubusercontent.com/Centralmatrix3/Matrix-io/master/Clash/Ruleset/Advertising.yaml
    behavior: domain
    interval: 86400
    format: yaml

  Global:
    type: http
    path: ./Ruleset/Global.yaml
    url: https://raw.githubusercontent.com/Centralmatrix3/Matrix-io/master/Clash/Ruleset/Global.yaml
    behavior: classical
    interval: 86400
    format: yaml

  LAN:
    type: http
    path: ./Ruleset/LAN.yaml
    url: https://raw.githubusercontent.com/Centralmatrix3/Matrix-io/master/Clash/Ruleset/LAN.yaml
    behavior: classical
    interval: 86400
    format: yaml

  GEOIPCN:
    type: http
    path: ./Ruleset/GEOIPCN.yaml
    url: https://raw.githubusercontent.com/Centralmatrix3/Matrix-io/master/Clash/Ruleset/GEOIPCN.yaml
    behavior: classical
    interval: 86400
    format: yaml
